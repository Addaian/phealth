# persona.yaml — single source of truth for the synthetic patient
# ----------------------------------------------------------------
# This file drives:
#   • the BPS intake content authored in SimplePractice (M2)
#   • the three progress notes authored in SimplePractice (M2)
#   • the golden tests in tests/test_scale_extractor.py and tests/test_provenance.py
#   • the face-validity checklist in tests/face_validity_checklist.md
#
# Every ASAM dimension (1-6) MUST trace to at least one field below.
# Every intentional compliance gap (G1-G5) MUST trace to a specific note/section.
# See documents/phase_1_PRD.md §5.1, §6.1, §6.3 for the contract this file fulfils.
#
# IMPORTANT: this is synthetic data. Do NOT introduce any field that maps to a
# real person you know — see playbook §Step 8 (face-validity / de-identification).

# -----------------------------------------------------------------------------
# 1. Demographics
# -----------------------------------------------------------------------------
demographics:
  external_id: "SP-MARCUS-REYES-0001"          # SimplePractice client ID, populated post-export
  given_name: "Marcus"
  middle_name: "J."
  family_name: "Reyes"
  date_of_birth: "1991-11-04"                  # age 34 at intake
  gender: "male"
  pronouns: "he/him"
  race_ethnicity: "Hispanic or Latino"
  preferred_language: "English"
  marital_status: "single"
  emergency_contact:
    name: "Daniel Reyes"
    relationship: "brother"
    phone: "(555) 010-4421"                   # synthetic, NXX-555 reserved range
  address:
    line: "412 Maplewood Ave, Apt 3B"          # fictional; do not map to a real address
    city: "Springfield"
    state: "IL"
    postal_code: "62704"
  insurance: "Medicaid (state managed care)"

# -----------------------------------------------------------------------------
# 2. Encounter context
# -----------------------------------------------------------------------------
encounter:
  admission_date: "2026-05-04"                 # day 0; all relative dates below are offsets
  referral_source: "Emergency Department"      # admitted after fall while intoxicated
  level_of_care_on_admission: "3.7"            # ASAM Medically Monitored Intensive Inpatient
  level_of_care_recommended_on_discharge: "2.5" # IOP (Note 3 step-down)
  expected_los_days: 14
  bps_intake_date: "2026-05-04"
  bps_clinician:
    name: "Dr. Aisha Patel, MD"
    role: "psychiatrist"
    npi: "1234567890"                          # synthetic NPI for demo
    credentials: "MD, board-certified addiction psychiatry"

# -----------------------------------------------------------------------------
# 3. Presenting problem / HPI
# -----------------------------------------------------------------------------
presenting_problem:
  chief_complaint: >
    "I fell at home and my brother brought me to the ED. They said I was withdrawing."
  hpi: >
    34yo male with 4-year history of heavy alcohol use and 18-month history of daily
    alprazolam (originally prescribed for anxiety, now obtained illicitly), presenting
    36 hours after last drink with tremor, sweats, sleep <2h, and a witnessed fall at
    home. Referred from ED for medically monitored withdrawal management after CIWA-Ar
    of 12 on arrival. Lost employment 6 weeks prior due to intoxication at work; DUI
    charge pending. Ambivalent about treatment ("I'm here because my brother said so").
  precipitants:
    - "Job loss 6 weeks ago (intoxication at work)"
    - "Pending DUI charge"
    - "Brother delivered ultimatum about housing"
  prior_treatment_attempts:
    - year: 2023
      type: "Outpatient counseling, 6 weeks"
      outcome: "Self-discontinued"
    - year: 2024
      type: "PCP-prescribed naltrexone, 3 months"
      outcome: "Non-adherent"

# -----------------------------------------------------------------------------
# 4. Substance use history (load-bearing for ASAM Dim 1 and Dim 4)
# -----------------------------------------------------------------------------
substance_use:
  - substance: "Alcohol"
    age_of_first_use: 16
    current_pattern: "~14 standard drinks/day x 4 years (vodka, beer)"
    last_use: "2026-05-03"                     # 24h before admission per HPI (36h before BPS)
    route: "oral"
    withdrawal_history: "Multiple episodes; one prior ED visit for seizure precaution"
    prior_treatment: "2023 outpatient, 2024 naltrexone trial"
  - substance: "Alprazolam (Xanax)"
    age_of_first_use: 32
    current_pattern: "1 mg PO daily x 18 months (originally Rx, now illicit)"
    last_use: "2026-05-03"
    route: "oral"
    withdrawal_history: "Anticipated; not yet manifest at intake"
    prior_treatment: "None"
  - substance: "Cannabis"
    age_of_first_use: 17
    current_pattern: "2-3 joints per week, recreational"
    last_use: "2026-04-28"
    route: "inhaled"
    withdrawal_history: "None reported"
    prior_treatment: "None"
  - substance: "Opioids"
    current_pattern: "DENIES current or past opioid use"
    notes: "COWS recorded as N/A; documented to demonstrate negative-finding handling"


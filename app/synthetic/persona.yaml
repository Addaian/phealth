# -----------------------------------------------------------------------------
# These strings are exactly what must appear (modulo phrasing tweaks for note
# voice) in the chart so the regex-first scale_extractor.py can lift them.
# Format follows PRD §6.2.
# -----------------------------------------------------------------------------
scales:
  phq9:
    administered_date: "2026-05-04"
    instrument: "PHQ-9"
    loinc: "44261-6"                            # PHQ-9 total
    items:
      anhedonia: 3
      depressed_mood: 3
      sleep: 3
      fatigue: 2
      appetite: 2
      self_worth: 2
      concentration: 2
      psychomotor: 1
      suicidal_ideation: 0
    total: 18
    severity: "moderately severe"
    verbatim: >
      PHQ-9 administered 2026-05-04: anhedonia 3, depressed mood 3, sleep 3,
      fatigue 2, appetite 2, self-worth 2, concentration 2, psychomotor 1,
      suicidal ideation 0 — total 18 (moderately severe).
    repeats_in_progress_notes: false           # ← G1 is embedded here

  gad7:
    administered_date: "2026-05-04"
    instrument: "GAD-7"
    loinc: "70274-6"
    items:
      nervousness: 3
      uncontrollable_worry: 3
      excessive_worry: 2
      trouble_relaxing: 2
      restlessness: 2
      irritability: 2
      fear: 1
    total: 15
    severity: "severe"
    verbatim: >
      GAD-7 administered 2026-05-04: nervousness 3, uncontrollable worry 3,
      excessive worry 2, trouble relaxing 2, restlessness 2, irritability 2,
      fear 1 — total 15 (severe).

  audit_c:
    administered_date: "2026-05-04"
    instrument: "AUDIT-C"
    loinc: "75624-7"
    items:
      frequency: 4
      typical_quantity: 4

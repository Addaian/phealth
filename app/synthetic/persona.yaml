# -----------------------------------------------------------------------------
# 10. ASAM 4th-edition dimensional risk profile
# -----------------------------------------------------------------------------
# Each dimension must trace to concrete evidence in the chart for the
# asam_evidence_index.py extractor to find.
# -----------------------------------------------------------------------------
asam_dimensions:
  dim_1:
    name: "Intoxication, Withdrawal, and Addiction Medications"
    risk_rating: "moderate-to-severe"
    evidence:
      - "CIWA-Ar = 12 on arrival (moderate withdrawal)"
      - "Concurrent alcohol + benzodiazepine dependence; benzo withdrawal anticipated"
      - "Last drink 36h prior; ETOH ~14 SD/day x 4 years"
      - "UDS positive for ethanol, benzodiazepines"
      - "Witnessed fall at home in context of intoxication"
    medications_indicated: "Librium taper (chlordiazepoxide), gabapentin adjunct, thiamine"
    moud_evaluation: "N/A — no opioid use disorder"

  dim_2:
    name: "Biomedical Conditions and Complications"
    risk_rating: "moderate"
    evidence:
      - "BP 158/96 (uncontrolled hypertension)"
      - "AST 142, ALT 98, GGT 312 (alcohol-related hepatic injury)"
      - "Total bilirubin 1.4 (mildly elevated)"
      - "Remote mTBI 2019"

  dim_3:
    name: "Emotional, Behavioral, and Cognitive Conditions/Complications"
    risk_rating: "moderate"
    evidence:
      - "PHQ-9 = 18 (moderately severe depression)"
      - "GAD-7 = 15 (severe anxiety)"
      - "C-SSRS Q2-positive (passive ideation)"
      - "Hx MDD recurrent, GAD; one prior psych hospitalization (2021)"
      - "Currently off psychiatric medications"

  dim_4:
    name: "Readiness to Change / Substance Use-Related Risks"
    risk_rating: "moderate-to-high"
    evidence:
      - "AUDIT-C = 11, DAST-10 = 7 (both high)"
      - "Continued use despite job loss, pending DUI, fall"
      - "Multiple prior failed outpatient and pharmacologic attempts"

  dim_5:
    name: "Recovery / Living Environment"
    risk_rating: "high"
    evidence:
      - "Lives with brother who is an active substance user"
      - "No sober supports identified"
      - "Unemployed; lost prior job for intoxication at work"
      - "Pending DUI charge"

  dim_6:
    name: "Person-Centered Considerations (ASAM 4th ed.)"
    risk_rating: "moderate"
    evidence:
      - "Ambivalent: 'I'm here because my brother said so'"
      - "Cultural identity: Hispanic Catholic background, currently not a source of support"
      - "Limited insight on MSE; willing to engage but reluctant"
    notes: "Per ASAM 4th edition, readiness-to-change is woven across all dimensions; Dim 6 captures person-centered factors assessed AFTER the other five."

recommended_level_of_care:
  on_admission: "3.7 — Medically Monitored Intensive Inpatient"
  rationale: >
    Dim 1 moderate-to-severe (active polysubstance withdrawal requiring 24h medical
    monitoring) and Dim 5 high (unsafe recovery environment) jointly drive a 3.7
    placement. Dims 2-4 are moderate and supported by inpatient resources.
  reassessment_at_day_8: "2.5 — Partial Hospitalization (IOP)"
  reassessment_rationale: >
    Dims 1 and 2 down to low (CIWA-Ar 2, no withdrawal x48h, BP improving on
    lisinopril); Dim 5 remains high but mitigated by daytime structured program.

# -----------------------------------------------------------------------------
# 11. Treatment plan (CTS.03.01.03 — golden thread anchor)
# -----------------------------------------------------------------------------
treatment_plan:
  established_date: "2026-05-04"
  goals:
    - id: "G-1"
      domain: "Substance use"
      goal: "Achieve and maintain 30 days of abstinence from alcohol and benzodiazepines"
      target_date: "2026-06-03"
      measure: "Daily breathalyzer, weekly UDS"
    - id: "G-2"
      domain: "Mental health"
      goal: "Reduce PHQ-9 score from 18 to <10 by 60 days"
      target_date: "2026-07-03"
      measure: "Bi-weekly PHQ-9"                # ← G1: this is the measure that never gets repeated
    - id: "G-3"
      domain: "Recovery environment"
      goal: "Identify and engage one sober support person and one alternate housing option"
      target_date: "2026-05-25"
      measure: "Social-work documentation"
  interventions:
    - "Cognitive Behavioral Therapy (CBT) — 3x/week individual"
    - "Motivational Interviewing (MI) — woven across sessions"
    - "Librium taper, gabapentin adjunct, thiamine"
    - "Psychiatric medication evaluation for MDD/GAD (in week 2)"
    - "Case-management for housing and DUI court navigation"
  # NOTE: peer-support is INTENTIONALLY NOT listed here. Note 2 documents a peer
  # group session; the absence here is gap G2.
  expected_outcomes:
    - "Stable medical withdrawal within 7 days"
    - "PHQ-9 < 10 by week 8"
    - "Step-down to PHP/IOP by week 2 if Dims 1 and 2 resolve"

# -----------------------------------------------------------------------------
# 12. Progress notes — content blueprint
# -----------------------------------------------------------------------------
# These are the three notes authored in SimplePractice in M2. Each entry lists
# the date, format, author, and the content beats that must appear so the
# section_detector + scale_extractor + asam_evidence_index can do their work.
# Gap embeddings are flagged with `embeds_gap`.
# -----------------------------------------------------------------------------
progress_notes:
  - sequence: 1
    date: "2026-05-06"                          # Day 2
    template_title: "[SOAP] Progress Note"
    format: "SOAP"
    author:
      name: "Dr. Aisha Patel, MD"
      role: "psychiatrist"
    encounter_type: "individual session"
    embeds_gap: "G1"                            # no PHQ-9 repeat in this or any later note
    sections:
      subjective: >
        "Tremor better, sleep still rough. Want to leave AMA but my brother won't take
        me back." Reports anxiety improving with librium. Denies SI/HI.
      objective: >
        BP 142/88, HR 92. CIWA-Ar = 8 (nausea 1, tremor 2, sweats 1, anxiety 2,
        agitation 1, headache 1) — down from 12 at intake. MSE: alert, cooperative,
        affect constricted, no acute distress. UDS pending.
      assessment: >
        Alcohol withdrawal, moderate, improving on chlordiazepoxide taper. Benzodiazepine
        withdrawal anticipated but not yet manifest. MDD and GAD untreated;
        defer pharmacologic initiation until withdrawal resolves.
      plan: >
        Continue chlordiazepoxide taper, add gabapentin 300mg TID for benzo
        withdrawal prophylaxis. Continue daily CIWA monitoring. MOUD evaluation
        deferred — no opioid use. Re-evaluate level of care in 5 days.
    expected_observations:
      - "CIWA-Ar = 8 (LOINC 72109-3)"
      - "BP 142/88"
      - "Medications added: gabapentin 300mg TID"

  - sequence: 2
    date: "2026-05-09"                          # Day 5
    template_title: "[DAP] Progress Note"
    format: "DAP"
    author:
      name: "Jordan Kim, CPRS"
      role: "peer recovery support specialist"
    encounter_type: "peer support group"
    embeds_gap: "G2"                            # peer-support is NOT on the treatment plan
    sections:
      data: >
        90-minute peer recovery support group. Marcus attended for full duration,
        contributed once regarding job loss and the impact on his sense of identity.
        Affect engaged during others' shares; observable reduction in psychomotor
        restlessness compared to admission week. No safety concerns.
      assessment: >
        Engagement improving. Continues to express ambivalence about long-term
        recovery but is participating in milieu. Peer connection appears protective.
      plan: >
        Continue daily peer-support groups. Schedule family-coordination call with
        brother for boundary-setting and post-discharge planning.
    expected_observations:
      - "Group attendance documented (intervention not on plan — gap G2)"

  - sequence: 3
    date: "2026-05-12"                          # Day 8
    template_title: "[DSAP] Progress Note"
    format: "DSAP"
    author:
      name: "Maria Gonzales, LCSW"
      role: "licensed clinical social worker"
    encounter_type: "individual + level-of-care reassessment"
    embeds_gap: "G3"                            # plan calls for C-SSRS re-administration but no result captured
    sections:
      data: >
        UDS negative across panel. CIWA-Ar = 2 (no withdrawal x 48h). BP 128/82 on
        lisinopril 10mg restarted day 4. LFTs trending down (AST 92, ALT 71). Attended
        4/4 daily groups this week.
      subjective: >
        "I think I'm ready to step down to PHP. My brother is still using though,
        so I'm worried about going home." Denies SI/HI today.
      assessment: >
        Ready clinically for step-down per Dim 1 (resolved withdrawal) and Dim 2
        (improving). Dim 3 (PHQ-9 not repeated this admission — see note),
        Dim 5 remains the limiting factor (unsafe home environment).
        Recommending 3.7 → 2.5 (Partial Hospitalization with IOP step) rather than
        full community discharge.
      plan: >
        Coordinate transfer to PHP starting 2026-05-15. Social-work to secure
        sober-housing referral. Re-administer C-SSRS prior to transfer per
        NPSG.15.01.01. Continue gabapentin; psychiatry follow-up scheduled day 14
        for MDD/GAD pharmacologic eval.
    expected_observations:
      - "CIWA-Ar = 2 (LOINC 72109-3) — terminal measurement"
      - "BP 128/82"
      - "ASAM LoC change: 3.7 → 2.5"
      - "C-SSRS re-administration planned but result NOT documented (gap G3)"

# -----------------------------------------------------------------------------
# 13. Intentional compliance gaps (must all be findable by tjc_coverage_matrix.py)
# -----------------------------------------------------------------------------
# Each gap is referenced from the relevant note above. The tjc_coverage_matrix
# emits one TjcCoverage row per EP with status `satisfied` | `gap` | `ambiguous`
# and a pointer to the evidence char-offset (or absence thereof).
# -----------------------------------------------------------------------------
intentional_gaps:
  - id: "G1"
    ep_code: "CTS.03.01.09"
    description: "Outcomes assessed with a standardized tool (measurement-based care)"
    gap: "PHQ-9 administered at intake (total = 18) but never repeated in any of the three progress notes despite a 60-day measurable goal in the treatment plan."
    embedded_in: "Absent from progress_notes[1].sections.assessment and from progress_notes[3].sections (where it should re-appear)"
    expected_finding_status: "gap"

  - id: "G2"
    ep_code: "CTS.03.01.03"
    description: "Plan for care reflects assessed needs (golden thread)"
    gap: "Note 2 (DAP, day 5) documents a peer recovery support group session. The treatment plan interventions list does NOT include peer-support — the intervention is being delivered without a planning entry."
    embedded_in: "progress_notes[2].sections.data references group attendance; treatment_plan.interventions has no peer-support entry"
    expected_finding_status: "gap"
    mirrors_perspectives_example: true          # see playbook §D landing-page example

  - id: "G3"
    ep_code: "NPSG.15.01.01"
    description: "Suicide screening using a validated tool (C-SSRS) at clinically appropriate intervals"
    gap: "Initial C-SSRS administered at intake (Q2-positive). Note 3 plan states 'Re-administer C-SSRS prior to transfer' but no C-SSRS result is documented anywhere in the chart prior to the recommended step-down."
    embedded_in: "scales.c_ssrs.reassessment_documented = false; progress_notes[3].sections.plan references reassessment without delivering it"
    expected_finding_status: "gap"

  - id: "G4"
    ep_code: "R3-25 (transitions of care)"
    description: "Discharge planning documented within 72 hours of admission for SUD treatment"
    gap: "No discharge planning note exists within the 72-hour window after admission (2026-05-04 → 2026-05-07). The first transition-of-care documentation is in Note 3 on day 8."
    embedded_in: "Absence: no document with type 'discharge_planning' between admission_date and admission_date + 72h"
    expected_finding_status: "gap"

  - id: "G5"
    ep_code: "RC.01.02.01"
    description: "Documentation authentication (signatures, co-signatures, timestamps)"
    gap: "Note 2 is authored by a peer recovery support specialist and should bear a clinical co-signature; the co-signature timestamp is inconsistent with the note's authored-on date (co-signed BEFORE the note's authored-on date, indicating a metadata error)."
    embedded_in: "progress_notes[2] author is non-clinical; co-signature timestamp anomaly to be created in SimplePractice or in the exported PDF metadata"
    expected_finding_status: "gap"

# -----------------------------------------------------------------------------
# 14. Face-validity / de-identification check (run before committing)
# -----------------------------------------------------------------------------
face_validity:
  - "Persona is wholly fictional; name, DOB, address, phone, NPI do not correspond to any real person known to author."
  - "All scale item-level scores sum correctly to documented totals (PHQ-9 = 18, GAD-7 = 15, AUDIT-C = 11, DAST-10 = 7, CIWA-Ar = 12)."

  dast10:
    administered_date: "2026-05-04"
    instrument: "DAST-10"
    loinc: "82666-9"
    total: 7
    severity: "substantial"
    verbatim: >
      DAST-10 administered 2026-05-04: total 7 (substantial level, indicates
      intensive assessment and treatment indicated).

  ciwa_ar:
    administered_date: "2026-05-04T14:30"
    instrument: "CIWA-Ar"
    loinc: "72109-3"
    items:
      nausea_vomiting: 2
      tremor: 3
      sweats: 2
      anxiety: 2
      agitation: 1
      tactile_disturbances: 0
      auditory_disturbances: 0
